name: Validate, Build and Deploy StoryForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: storyforge-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and build
        run: |
          npm run build
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is missing."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "${{ runner.temp }}/firebase-service-account.json"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: lumio-forge
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          npm install -g firebase-tools
          firebase --version

          if firebase hosting:sites:get "$FIREBASE_PROJECT_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $FIREBASE_PROJECT_ID already exists."
          else
            echo "Creating Hosting site $FIREBASE_PROJECT_ID..."
            firebase hosting:sites:create "$FIREBASE_PROJECT_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive


      - name: Verify public Firestore runtime
        run: node scripts/firestore-public-smoke.mjs

      - name: Report Firebase Analytics availability
        continue-on-error: true
        run: |
          node <<'NODE'
          const url = 'https://lumio-forge.web.app/__/firebase/init.json';
          try {
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) {
              console.log('StoryForge analytics backend: Firebase init config unavailable; local analytics remains active.');
              process.exit(0);
            }
            const config = await response.json();
            console.log(
              config.measurementId
                ? 'StoryForge analytics backend: Firebase/Google Analytics configured.'
                : 'StoryForge analytics backend: no GA measurement ID; local analytics remains active.'
            );
          } catch {
            console.log('StoryForge analytics backend: status check failed; local analytics remains active.');
          }
          NODE

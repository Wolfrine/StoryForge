name: Visual QA

on:
  push:
    branches:
      - design-v0.3
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/storyforge-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/storyforge-preview.log
          exit 1

      - name: Capture representative states
        run: node scripts/capture.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: storyforge-visual-qa
          path: qa-screenshots
          if-no-files-found: error
          retention-days: 7

name: StoryForge visual verification

on:
  push:
    branches: [main]
    paths: ['.github/workflows/visual-review.yml']
  workflow_run:
    workflows: ['Validate, Build and Deploy StoryForge']
    types: [completed]

concurrency:
  group: storyforge-visual-review
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and application dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Inspect published elements
        run: |
          mkdir -p review/media
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const base = 'https://lumio-forge.web.app';
          const decode = (v) => {
            if ('mapValue' in v) return Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k, x]) => [k, decode(x)]));
            if ('arrayValue' in v) return (v.arrayValue.values || []).map(decode);
            if ('integerValue' in v) return Number(v.integerValue);
            if ('doubleValue' in v) return v.doubleValue;
            if ('booleanValue' in v) return v.booleanValue;
            if ('nullValue' in v) return null;
            return v.stringValue ?? v.timestampValue ?? '';
          };
          const root = 'https://firestore.googleapis.com/v1/projects/lumio-forge/databases/(default)/documents/storyworlds/novasaga';
          const get = async (url) => { const r = await fetch(url); if (!r.ok) throw new Error(`${r.status}: ${url}`); return r.json(); };
          const doc = await get(root);
          let next = '', packages = [];
          do {
            const page = await get(root + '/packages?pageSize=100' + (next ? '&pageToken=' + encodeURIComponent(next) : ''));
            packages.push(...(page.documents || []).map(x => decode({mapValue: {fields: x.fields}})));
            next = page.nextPageToken || '';
          } while (next);
          const world = {...decode({mapValue: {fields: doc.fields}}), packages};
          await fs.writeFile('review/live-world.json', JSON.stringify(world, null, 2));
          const media = [];
          for (const pkg of packages) {
            for (const asset of (pkg.media || []).slice(0, 8)) {
              const row = {packageId: pkg.id, ...asset};
              try {
                const url = new URL(asset.src);
                if (url.protocol !== 'https:') continue;
                const r = await fetch(url, {signal: AbortSignal.timeout(15000)});
                row.status = r.status;
                if (r.ok && asset.type === 'image') {
                  const buffer = Buffer.from(await r.arrayBuffer());
                  if (buffer.length <= 10000000) {
                    row.local = `media/${pkg.id.replace(/[^a-z0-9-]/g,'')}-${asset.id.replace(/[^a-z0-9-]/g,'')}.img`;
                    await fs.writeFile('review/' + row.local, buffer);
                  }
                }
              } catch (error) { row.error = String(error); }
              media.push(row);
            }
          }
          const browser = await chromium.launch({headless: true});
          const report = {commit: process.env.GITHUB_SHA, packages: packages.map(p => p.id), media, views: []};
          try {
            for (const viewport of [{width:1440,height:1000},{width:390,height:844}]) {
              const context = await browser.newContext({viewport, serviceWorkers:'block', reducedMotion:'reduce'});
              const page = await context.newPage();
              for (const id of ['', ...packages.map(p => p.id)]) {
                const errors = [];
                const onError = error => errors.push(String(error));
                page.on('pageerror', onError);
                await page.goto(base + (id ? '/?package=' + encodeURIComponent(id) : '/'), {waitUntil:'networkidle', timeout:45000});
                await page.waitForTimeout(800);
                const name = `${viewport.width}-${id || 'landing'}.png`;
                await page.screenshot({path:'review/' + name, fullPage:true});
                const metrics = await page.evaluate(() => ({overflow:document.documentElement.scrollWidth > innerWidth + 2, brokenImages:[...document.images].filter(i => !i.complete || i.naturalWidth === 0).map(i => i.src), title:document.querySelector('h1')?.textContent, buttons:[...document.querySelectorAll('button')].map(b => b.textContent?.trim())}));
                report.views.push({id, viewport, screenshot:name, errors, ...metrics});
                page.off('pageerror', onError);
              }
              await context.close();
            }
          } finally { await browser.close(); }
          await fs.writeFile('review/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify({packages:report.packages, media:media.map(({packageId,id,status}) => ({packageId,id,status})), views:report.views.map(({id,viewport,overflow,brokenImages,errors}) => ({id,width:viewport.width,overflow,brokenImages,errors}))},null,2));
          NODE
      - name: Bundle reproducible local review workspace
        if: github.event_name == 'push'
        run: |
          tar -czf review/workspace.tgz src public schema scripts storyworld node_modules package.json package-lock.json tsconfig.json vite.config.ts index.html .harness AGENTS.md docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storyforge-visual-review
          path: review/
          retention-days: 7

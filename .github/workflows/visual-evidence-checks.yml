name: Validate visual evidence changes
on:
  pull_request:
    paths: ['src/**', 'scripts/visual-review-evidence*', '.github/workflows/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/visual-review-evidence.test.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build

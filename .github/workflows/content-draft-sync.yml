name: StoryForge Creator Draft Sync

on:
  push:
    branches:
      - "content/**"
    paths:
      - "storyworld/authoring/packages/**/package.json"

jobs:
  sync-drafts:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "${{ runner.temp }}/firebase-service-account.json"

      - name: Push changed packages to Firestore drafts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: lumio-forge
          STORYFORGE_WORLD_ID: novasaga
          STORYFORGE_AGENT_ID: github:${{ github.actor }}
        run: |
          set -euo pipefail

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD^ HEAD -- 'storyworld/authoring/packages/**/package.json')
          else
            FILES=$(git ls-files 'storyworld/authoring/packages/**/package.json')
          fi

          if [ -z "$FILES" ]; then
            echo "No changed StoryForge packages."
            exit 0
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Syncing draft: $file"
            npm run content:admin -- put "$file" draft
          done <<< "$FILES"

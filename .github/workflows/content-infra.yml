name: StoryForge Content Infrastructure

on:
  push:
    branches:
      - pwa-content-v1
    paths:
      - ".github/workflows/content-infra.yml"
  workflow_dispatch:

jobs:
  setup-content:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is missing."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "${{ runner.temp }}/firebase-service-account.json"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Ensure Firestore database exists
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          if firebase firestore:databases:get "(default)" --project lumio-forge --non-interactive >/dev/null 2>&1; then
            echo "Firestore (default) already exists."
          else
            echo "Creating Firestore (default) in asia-south1..."
            firebase firestore:databases:create "(default)"               --location=asia-south1               --project lumio-forge               --non-interactive
          fi

      - name: Deploy Firestore rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy             --project lumio-forge             --only firestore             --non-interactive

      - name: Seed current published content
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: lumio-forge
          STORYFORGE_WORLD_ID: novasaga
          STORYFORGE_AGENT_ID: initial-firestore-migration
        run: npm run content:seed

      - name: Verify published content
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: lumio-forge
          STORYFORGE_WORLD_ID: novasaga
          STORYFORGE_AGENT_ID: infrastructure-verification
        run: npm run content:list

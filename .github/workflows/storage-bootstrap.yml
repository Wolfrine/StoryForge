name: StoryForge Media Storage Bootstrap

on:
  push:
    branches:
      - media-pipeline-v1
    paths:
      - ".github/workflows/storage-bootstrap.yml"
      - "scripts/storage-bootstrap.mjs"
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "${{ runner.temp }}/firebase-service-account.json"

      - name: Ensure StoryForge media bucket
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: lumio-forge
          STORYFORGE_STORAGE_LOCATION: ASIA-SOUTH1
        run: node scripts/storage-bootstrap.mjs
